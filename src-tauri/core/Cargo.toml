[package]
name = "netmask-core"
version = "2.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Bello Bilal <bb2010ng@gmail.com>"]
description = "NetMask native engines, independent of the desktop webview"

[lib]
path = "../src/core.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
regex = "1"
base64 = "0.23"
semver = "1"
url = "2"
sha2 = "0.10"
reqwest = { version = "0.13", features = ["blocking", "json"] }
qrcodegen = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Networking_NetworkListManager"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
