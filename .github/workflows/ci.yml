name: CI & Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for interface checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Save interface check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-checks
          path: .tmp/ui-checks
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.os }})
    needs: typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run dist:win
          - os: macos-latest
            build_cmd: npm run dist:mac
          - os: macos-15-intel
            build_cmd: npm run dist:mac
          - os: ubuntu-latest
            build_cmd: npm run dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64
      - run: npm ci
      - run: npm run build
      - run: npm run format:native
      - run: npm run check:native
      - run: npm run test:native
      - name: Build native installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ${{ matrix.build_cmd }}

  gate:
    name: CI Gate
    if: always()
    needs: [typecheck, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify builds and classify unavailable runners
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-ci-run.cjs
