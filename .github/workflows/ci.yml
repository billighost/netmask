name: CI & Code Quality

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Verification Suite
        run: npm run test

      - name: Run Hook Linter
        run: npm run lint

  build:
    name: Build (${{ matrix.os }})
    needs: typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libarchive-tools libsecret-1-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run vite:build

      - name: Tauri Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Tauri Cargo Test
        run: cargo test --bin netmask --manifest-path src-tauri/Cargo.toml

      - name: Compile application (legacy electron-vite build)
        run: npm run build
        continue-on-error: true

      - name: Measure Performance & Memory Footprint (Linux Headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node scripts/benchmark.js
        continue-on-error: true

      - name: Measure Performance & Memory Footprint (Windows / macOS)
        if: runner.os != 'Linux'
        run: node scripts/benchmark.js
        continue-on-error: true
