appId: com.netmask.app
productName: NetMask
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/netmask.ico
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NetMask
  installerIcon: resources/netmask.ico
  uninstallerIcon: resources/netmask.ico
publish:
  provider: github
  private: true

